<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axophy - Login do Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-slate-900 text-slate-200 font-sans h-screen flex items-center justify-center">

    <div class="bg-slate-950 p-8 rounded-lg border border-slate-800 shadow-2xl w-full max-w-md relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-blue-600"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-500 tracking-widest mb-1">AXOPHY</h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest">Portal de Acesso Integrado</p>
        </div>

        <div id="error-message" class="hidden mb-4 p-3 bg-red-900/50 border border-red-700 rounded text-red-300 text-sm text-center font-bold">
            Credenciais inválidas. Tente novamente.
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2 font-bold" for="username">Usuário</label>
                <input type="text" id="username" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-3 text-slate-200 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="Ex: operador" required autocomplete="off">
            </div>

            <div>
                <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2 font-bold" for="password">Senha</label>
                <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 rounded px-4 py-3 text-slate-200 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded uppercase tracking-widest transition-colors mt-4">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-[10px] text-slate-600">Axophy Industrial Systems v1.0 &copy; 2026</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
