<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axophy - Plant CAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="diretor.css">
</head>
<body class="h-screen w-screen flex font-sans overflow-hidden">

    <aside class="w-80 glass-panel flex flex-col h-full z-20 shrink-0 shadow-2xl">
        
        <div class="p-5 border-b border-slate-700">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-xl font-black text-blue-500 tracking-wider">AXOPHY</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">Plant CAD Planner</p>
                </div>
                <button onclick="window.location.href='../login.html'" class="text-slate-400 hover:text-white p-2 hover:bg-red-900/50 rounded transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
            
            <div class="flex gap-2">
                <button onclick="exportJSON()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 py-1.5 rounded text-[9px] font-bold uppercase transition-colors">
                    ↓ Exportar
                </button>
                <button onclick="document.getElementById('import-file').click()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 py-1.5 rounded text-[9px] font-bold uppercase transition-colors">
                    ↑ Importar
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importJSON(event)">
            </div>
        </div>

        <div class="flex text-[10px] font-bold uppercase tracking-widest border-b border-slate-700 bg-slate-900/50">
            <button id="tab-assets" onclick="switchTab('assets')" class="flex-1 py-3 text-blue-400 border-b-2 border-blue-500 bg-slate-800 transition-colors">Máquinas</button>
            <button id="tab-layout" onclick="switchTab('layout')" class="flex-1 py-3 text-slate-500 hover:text-slate-300 transition-colors">Construção</button>
        </div>

        <div id="content-assets" class="p-5 flex-1 overflow-y-auto">
            <form id="crud-form" class="space-y-4">
                <input type="hidden" id="asset-id" value="">
                
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">Nome do Equipamento</label>
                    <input type="text" id="asset-name" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 outline-none">
                </div>
                
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">Geometria (Ícone)</label>
                    <select id="asset-icon" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 outline-none">
                        <option value="motor">Motor de Indução</option>
                        <option value="pump">Bomba Hidráulica</option>
                        <option value="press">Prensa Industrial</option>
                        <option value="conveyor">Esteira Transportadora</option>
                        <option value="arm">Braço Robótico</option>
                        <option value="cnc">Fresadora CNC</option>
                        <option value="lathe">Torno Mecânico</option>
                    </select>
                </div>

                <div class="border-t border-slate-700 pt-4 mt-2">
                    <label class="block text-[10px] text-yellow-500 uppercase font-bold mb-2">Limites Operacionais</label>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-[9px] text-slate-400 uppercase">Temp. Máx (°C)</label>
                            <input type="number" step="0.1" id="asset-temp" required class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-slate-200" value="60.0">
                        </div>
                        <div>
                            <label class="block text-[9px] text-slate-400 uppercase">Corr. Máx (A)</label>
                            <input type="number" step="0.1" id="asset-curr" required class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-slate-200" value="14.0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] text-slate-400 uppercase">Vibração Máx (g)</label>
                        <input type="number" step="0.1" id="asset-vib" required class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-slate-200" value="10.0">
                    </div>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="submit" id="btn-save" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded uppercase transition-colors">Adicionar Ativo</button>
                    <button type="button" id="btn-cancel" onclick="resetAssetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded">X</button>
                </div>
            </form>
        </div>

        <div id="content-layout" class="p-5 flex-1 overflow-y-auto hidden">
            <div class="space-y-3">
                <button onclick="addZone('machine')" class="w-full bg-green-900/40 border border-green-700 text-green-300 text-xs py-3 rounded uppercase font-bold flex items-center justify-center gap-2">
                    <span class="w-3 h-3 border-2 border-dashed border-green-400"></span> Zona de Máquinas
                </button>
                <button onclick="addZone('passage')" class="w-full bg-yellow-900/40 border border-yellow-700 text-yellow-300 text-xs py-3 rounded uppercase font-bold flex items-center justify-center gap-2">
                    <span class="w-3 h-3 border-2 border-dashed border-yellow-400 bg-yellow-900/50"></span> Zona de Passagem
                </button>
                <button onclick="addZone('wall')" class="w-full bg-slate-700 border border-slate-500 text-slate-200 text-xs py-3 rounded uppercase font-bold flex items-center justify-center gap-2">
                    <span class="w-3 h-3 bg-slate-400"></span> Parede Fixa
                </button>
            </div>
            
            <div class="mt-8 pt-4 border-t border-slate-700">
                <button onclick="clearAllData()" class="w-full bg-transparent hover:bg-red-900/50 border border-red-900 text-red-500 text-[10px] py-2 rounded uppercase font-bold transition-colors">
                    Zerar Projeto Inteiro
                </button>
            </div>
        </div>

        <div class="p-5 border-t border-slate-700 bg-slate-900">
            <button onclick="saveProjectToMemory()" class="w-full bg-green-700 hover:bg-green-600 border border-green-500 text-white text-xs font-bold py-3 rounded uppercase tracking-widest shadow-[0_0_10px_rgba(22,163,74,0.3)]">
                Gravar Projeto Local
            </button>
        </div>
    </aside>

    <main class="viewport" id="viewport" tabindex="0">
        
        <div class="absolute top-4 right-4 z-[999] bg-slate-900/90 p-3 rounded border border-slate-700 text-[10px] text-slate-300 pointer-events-none shadow-xl">
            <strong class="text-blue-400 block mb-1 uppercase">Comandos CAD:</strong>
            <ul class="list-disc pl-4 space-y-1">
                <li><strong>Clique:</strong> Seleciona | <strong>Delete:</strong> Remove</li>
                <li><strong>CTRL+C / CTRL+V:</strong> Clonar seleção</li>
                <li><strong>Duplo Clique:</strong> Edita Máquina</li>
                <li><strong>Scroll:</strong> Zoom | <strong>Fundo:</strong> Navegar</li>
            </ul>
        </div>

        <div class="factory-floor" id="floor-plan"></div>
    </main>

    <script id="svg-dictionary" type="application/json">
        {
            "motor": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><rect x='25' y='30' width='50' height='40' rx='4'/><rect x='35' y='20' width='30' height='10' rx='2'/><rect x='10' y='45' width='15' height='10' rx='1'/><line x1='30' y1='35' x2='30' y2='65' stroke='#0f172a' stroke-width='2'/><line x1='40' y1='35' x2='40' y2='65' stroke='#0f172a' stroke-width='2'/><line x1='50' y1='35' x2='50' y2='65' stroke='#0f172a' stroke-width='2'/><line x1='60' y1='35' x2='60' y2='65' stroke='#0f172a' stroke-width='2'/><line x1='70' y1='35' x2='70' y2='65' stroke='#0f172a' stroke-width='2'/></svg>",
            "pump": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><circle cx='45' cy='50' r='30' fill='none' stroke='currentColor' stroke-width='8'/><rect x='65' y='40' width='25' height='20' rx='2'/><rect x='10' y='45' width='15' height='10'/><path d='M35,60 L55,40' stroke='currentColor' stroke-width='6' stroke-linecap='round'/></svg>",
            "press": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><rect x='15' y='10' width='70' height='15' rx='2'/><rect x='20' y='25' width='15' height='65'/><rect x='65' y='25' width='15' height='65'/><rect x='35' y='40' width='30' height='20' fill='#0f172a' stroke='currentColor' stroke-width='4'/></svg>",
            "conveyor": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><rect x='10' y='40' width='80' height='20' rx='10'/><circle cx='25' cy='50' r='5' fill='#0f172a'/><circle cx='50' cy='50' r='5' fill='#0f172a'/><circle cx='75' cy='50' r='5' fill='#0f172a'/></svg>",
            "arm": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><path d='M30,80 L70,80 L60,60 L40,60 Z'/><circle cx='50' cy='55' r='10'/><path d='M50,45 L70,25 L80,35' stroke='currentColor' stroke-width='8' stroke-linecap='round' fill='none'/><circle cx='70' cy='25' r='6'/><path d='M70,25 L90,10' stroke='currentColor' stroke-width='4' stroke-linecap='round' fill='none'/></svg>",
            "cnc": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><rect x='20' y='30' width='60' height='50' rx='2'/><rect x='25' y='40' width='50' height='25' fill='#0f172a'/><path d='M50,20 L50,45' stroke='currentColor' stroke-width='4'/><polygon points='45,45 55,45 50,55'/></svg>",
            "lathe": "<svg viewBox='0 0 100 100' fill='currentColor' class='w-full h-full'><rect x='10' y='50' width='80' height='20' rx='2'/><rect x='15' y='35' width='20' height='15'/><rect x='65' y='40' width='15' height='10'/><path d='M35,42 L65,42' stroke='currentColor' stroke-width='3' stroke-dasharray='4'/></svg>"
        }
    </script>
    <script src="diretor.js"></script>
</body>
</html>
